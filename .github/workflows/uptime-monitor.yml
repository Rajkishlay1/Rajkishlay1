name: 🛡️ Involtics & Watthut Production Fleet Watchdog

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Manual trigger button in GitHub UI

jobs:
  fleet-health-check:
    name: Fleet Health Watchdog (8 Endpoints)
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          pip install --no-cache-dir requests urllib3

      - name: 🔍 Execute Fleet Monitor
        id: monitor
        run: |
          python scripts/monitor_fleet.py

      - name: 🚨 Notify On Critical Outage
        if: failure()
        run: |
          echo "============================================================"
          echo "🚨 CRITICAL OUTAGE DETECTED ON PRIMARY INVOLTICS SERVICES"
          echo "============================================================"
          echo "Check the step summary table above for detailed status."
          echo "Alert dispatched to: rajkishlay786@gmail.com"
          exit 1
