<svg fill="none" viewBox="0 0 450 165" width="450" height="165" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect width="450" height="165" rx="10" fill="#0A0E1A" />

  <!-- Title -->
  <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#00D4FF">
    Most Used Languages (Production Stack)
  </text>

  <!-- Progress Bar Container -->
  <g transform="translate(25, 52)">
    <mask id="barMask">
      <rect width="400" height="10" rx="5" fill="#fff" />
    </mask>
    <g mask="url(#barMask)">
      <!-- Python: 54% (216px) -->
      <rect x="0" y="0" width="216" height="10" fill="#3572A5" />
      <!-- SQL / Timescale: 24% (96px) -->
      <rect x="216" y="0" width="96" height="10" fill="#e38c00" />
      <!-- JavaScript: 12% (48px) -->
      <rect x="312" y="0" width="48" height="10" fill="#f1e05a" />
      <!-- Shell: 10% (40px) -->
      <rect x="360" y="0" width="40" height="10" fill="#89e051" />
    </g>
  </g>

  <!-- Legend Items -->
  <g transform="translate(25, 88)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#E2E8F0">
    <!-- Col 1 -->
    <circle cx="6" cy="6" r="5" fill="#3572A5" />
    <text x="18" y="10">Python (Django / DRF / FastAPI) <tspan fill="#64748B" font-size="11">54.0%</tspan></text>

    <circle cx="6" cy="38" r="5" fill="#f1e05a" />
    <text x="18" y="42">JavaScript / React (SolarHub UI) <tspan fill="#64748B" font-size="11">12.0%</tspan></text>

    <!-- Col 2 -->
    <g transform="translate(225, 0)">
      <circle cx="6" cy="6" r="5" fill="#e38c00" />
      <text x="18" y="10">SQL (TimescaleDB / Postgres) <tspan fill="#64748B" font-size="11">24.0%</tspan></text>

      <circle cx="6" cy="38" r="5" fill="#89e051" />
      <text x="18" y="42">Shell / Bash (Linux Automation) <tspan fill="#64748B" font-size="11">10.0%</tspan></text>
    </g>
  </g>
</svg>
