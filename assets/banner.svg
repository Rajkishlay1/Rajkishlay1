<svg fill="none" viewBox="0 0 900 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b33" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="900" height="220" rx="16" fill="url(#bgGradient)" stroke="#1e3a5f" stroke-width="1.5" />

  <!-- Subtle Glow Effect -->
  <circle cx="100" cy="40" r="120" fill="#00d4ff" opacity="0.06" filter="blur(40px)" />
  <circle cx="800" cy="180" r="120" fill="#2563eb" opacity="0.08" filter="blur(40px)" />

  <!-- Name -->
  <text x="50" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    KISHLAY RAJ
  </text>

  <!-- Title -->
  <text x="50" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="url(#cyanGradient)">
    Lead Backend &amp; Distributed Systems Engineer | AI Agent Architect
  </text>

  <!-- Metrics / Highlights -->
  <g transform="translate(50, 155)">
    <!-- Pill 1: 4,911+ Dataloggers -->
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#111c30" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="16" cy="16" r="4" fill="#00d4ff" />
    <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
      4,911+ Dataloggers
    </text>

    <!-- Pill 2: 150 Plants & 623 kWp -->
    <rect x="192" y="0" width="195" height="32" rx="16" fill="#111c30" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="208" cy="16" r="4" fill="#10b981" />
    <text x="220" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
      152 Plants (632+ kWp)
    </text>

    <!-- Pill 3: 99.9% Uptime -->
    <rect x="399" y="0" width="135" height="32" rx="16" fill="#111c30" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="415" cy="16" r="4" fill="#f59e0b" />
    <text x="427" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
      99.9% Uptime
    </text>

    <!-- Pill 4: LangChain & MCP -->
    <rect x="546" y="0" width="220" height="32" rx="16" fill="#111c30" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="562" cy="16" r="4" fill="#8b5cf6" />
    <text x="574" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
      LangChain &amp; Anthropic MCP
    </text>
  </g>
</svg>
